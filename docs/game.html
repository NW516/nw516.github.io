<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Catch the Stars</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(to bottom, #001d3d, #003566);
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
    }
    #game {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    #basket {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 40px;
      background: gold;
      border-radius: 10px;
    }
    .star {
      position: absolute;
      width: 30px;
      height: 30px;
      background: yellow;
      border-radius: 50%;
      box-shadow: 0 0 10px yellow;
    }
    #score, #misses {
      position: absolute;
      top: 10px;
      font-size: 20px;
    }
    #score { left: 10px; }
    #misses { left: 150px; }
    #message {
      display: none;
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 26px;
      font-weight: bold;
      color: #ffd60a;
      text-shadow: 0 0 10px #fff;
      padding: 20px;
    }
    #playerSelect {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 16px;
      padding: 5px;
    }
    #playAgain {
      display: none;
      position: absolute;
      top: 55%;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px;
      font-size: 18px;
      font-weight: bold;
      background: #ffc300;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 10px #000;
    }
    #playAgain:hover { background: #ffd60a; }
  </style>
</head>
<body>
  <div id="game">
    <select id="playerSelect">
      <option value="">-- Select Player --</option>
      <option value="Alex">Alex</option>
      <option value="Sammi">Sammi</option>
    </select>

    <div id="basket"></div>
    <div id="score">Score: 0</div>
    <div id="misses">Misses: 0</div>
    <div id="message"></div>
    <button id="playAgain">Play Again</button>
  </div>

  <script>
    const game = document.getElementById("game");
    const basket = document.getElementById("basket");
    const scoreDisplay = document.getElementById("score");
    const missesDisplay = document.getElementById("misses");
    const message = document.getElementById("message");
    const playerSelect = document.getElementById("playerSelect");
    const playAgainBtn = document.getElementById("playAgain");

    let score = 0;
    let misses = 0;
    const winScore = 10;
    const loseLimit = 10;

    let basketX = window.innerWidth / 2 - 40;
    let currentPlayer = "";
    let gameOver = false;

    let starInterval = null;
    let starSpeed = 5;
    let spawnRate = 1000;

    // Move basket
    document.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft") basketX -= 30;
      if (e.key === "ArrowRight") basketX += 30;
      basket.style.left = basketX + "px";
    });

    playerSelect.addEventListener("change", () => {
      currentPlayer = playerSelect.value;
      resetGame();
    });

    function createStar() {
      if (!currentPlayer || gameOver) return;

      const star = document.createElement("div");
      star.classList.add("star");
      star.style.left = Math.random() * (window.innerWidth - 30) + "px";
      star.style.top = "0px";
      game.appendChild(star);
      moveStar(star);
    }

    function moveStar(star) {
      let fallSpeed = starSpeed;

      let interval = setInterval(() => {
        let top = parseInt(star.style.top);
        star.style.top = top + fallSpeed + "px";

        // Catch
        let b = basket.getBoundingClientRect();
        let s = star.getBoundingClientRect();

        if (
          s.bottom >= b.top &&
          s.left >= b.left &&
          s.right <= b.right
        ) {
          score++;
          scoreDisplay.textContent = "Score: " + score;
          game.removeChild(star);
          clearInterval(interval);

          if (score >= winScore) {
            winGame();
            break;
          } else {
            increaseDifficulty();
          }
        }

        // Miss
        if (top > window.innerHeight) {
          misses++;
          missesDisplay.textContent = "Misses: " + misses;
          game.removeChild(star);
          clearInterval(interval);

          if (misses >= loseLimit) {
            loseGame();
          }
        }

      }, 50);
    }

    // Difficulty scaling
    function increaseDifficulty() {
      if (score % 2 === 0 && starSpeed < 15) starSpeed++;
      if (score % 3 === 0 && spawnRate > 400) {
        spawnRate -= 50;
        restartSpawner();
      }
    }

    function startSpawner() {
      starInterval = setInterval(createStar, spawnRate);
    }

    function stopSpawner() {
      clearInterval(starInterval);
    }

    function restartSpawner() {
      stopSpawner();
      startSpawner();
    }

    // Win
    function winGame() {
      gameOver = true;
      stopSpawner();

      let msg = currentPlayer === "Alex"
        ? "🌟 Alex, you did it! Clue unlocked: 'Place to sit, expressed in fractions' 🌟"
        : "✨ Sammi, amazing! Clue unlocked: 'Nobody has been allowed here for a few weeks.' ✨";

      message.textContent = msg;
      message.style.display = "block";
      playAgainBtn.style.display = "block";
    }

    // Lose
    function loseGame() {
      gameOver = true;
      stopSpawner();

      message.textContent = "💀 Game Over — Try Again!";
      message.style.display = "block";
      playAgainBtn.style.display = "block";
    }

    // Reset
    function resetGame() {
      score = 0;
      misses = 0;
      starSpeed = 5;
      spawnRate = 1000;
      gameOver = false;

      scoreDisplay.textContent = "Score: 0";
      missesDisplay.textContent = "Misses: 0";

      message.style.display = "none";
      playAgainBtn.style.display = "none";

      document.querySelectorAll(".star").forEach(s => s.remove());

      stopSpawner();
      if (currentPlayer) startSpawner();
    }

    playAgainBtn.addEventListener("click", resetGame);
  </script>
</body>
</html>
