<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Catch the Stars</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(to bottom, #001d3d, #003566);
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
    }
    #game {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    #basket {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 40px;
      background: gold;
      border-radius: 10px;
    }
    .star {
      position: absolute;
      width: 30px;
      height: 30px;
      background: yellow;
      border-radius: 50%;
      box-shadow: 0 0 10px yellow;
    }
    #score {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 20px;
    }
    #message {
      display: none;
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 26px;
      font-weight: bold;
      color: #ffd60a;
      text-shadow: 0 0 10px #fff;
      padding: 20px;
    }
    #playerSelect {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 16px;
      padding: 5px;
    }
    #playAgain {
      display: none;
      position: absolute;
      top: 55%;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px;
      font-size: 18px;
      font-weight: bold;
      background: #ffc300;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 10px #000;
    }
    #playAgain:hover {
      background: #ffd60a;
    }
  </style>
</head>
<body>
  <div id="game">
    <select id="playerSelect">
      <option value="">-- Select Player --</option>
      <option value="Alex">Alex</option>
      <option value="Sammi">Sammi</option>
    </select>
    <div id="basket"></div>
    <div id="score">Score: 0</div>
    <div id="message"></div>
    <button id="playAgain">Play Again</button>
  </div>

  <script>
    const game = document.getElementById("game");
    const basket = document.getElementById("basket");
    const scoreDisplay = document.getElementById("score");
    const message = document.getElementById("message");
    const playerSelect = document.getElementById("playerSelect");
    const playAgainBtn = document.getElementById("playAgain");

    let score = 0;
    const winScore = 10;
    let basketX = window.innerWidth / 2 - 40;
    let currentPlayer = "";
    let gameOver = false;
    let starInterval = null;
    let starSpeed = 5; // initial fall speed (pixels per frame)
    let spawnRate = 1000; // initial spawn rate (milliseconds)

    // Move basket with arrow keys
    document.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft") basketX -= 30;
      if (e.key === "ArrowRight") basketX += 30;
      basket.style.left = basketX + "px";
    });

    // Update selected player
    playerSelect.addEventListener("change", () => {
      currentPlayer = playerSelect.value;
      resetGame();
    });

    // Create stars
    function createStar() {
      if (!currentPlayer || gameOver) return; // No stars if game not active

      const star = document.createElement("div");
      star.classList.add("star");
      star.style.left = Math.random() * (window.innerWidth - 30) + "px";
      star.style.top = "0px";
      game.appendChild(star);
      moveStar(star);
    }

    // Move stars downward
    function moveStar(star) {
      let fallSpeed = starSpeed;
      let starInterval = setInterval(() => {
        let starTop = parseInt(star.style.top);
        star.style.top = starTop + fallSpeed + "px";

        // Collision detection
        let basketRect = basket.getBoundingClientRect();
        let starRect = star.getBoundingClientRect();
        if (
          starRect.bottom >= basketRect.top &&
          starRect.left >= basketRect.left &&
          starRect.right <= basketRect.right
        ) {
          score++;
          scoreDisplay.textContent = "Score: " + score;
          game.removeChild(star);
          clearInterval(starInterval);

          if (score >= winScore) {
            revealMessage();
          } else {
            increaseDifficulty();
          }
        }

        // Remove if it falls past bottom
        if (starTop > window.innerHeight) {
          game.removeChild(star);
          clearInterval(starInterval);
        }
      }, 50);
    }

    // Increase difficulty gradually
    function increaseDifficulty() {
      // Stars fall faster every 2 points
      if (score % 2 === 0 && starSpeed < 15) {
        starSpeed += 1;
      }
      // Spawn faster every 3 points
      if (score % 3 === 0 && spawnRate > 400) {
        spawnRate -= 100;
        restartStarSpawner();
      }
    }

    // Drop stars at intervals
    function startStarSpawner() {
      starInterval = setInterval(createStar, spawnRate);
    }

    function stopStarSpawner() {
      clearInterval(starInterval);
      starInterval = null;
    }

    function restartStarSpawner() {
      stopStarSpawner();
      startStarSpawner();
    }

    // Reveal personalized message
    function revealMessage() {
      gameOver = true;
      stopStarSpawner();
      let msg = "";
      if (currentPlayer === "Alex") {
        msg = "🌟 Alex, you did it! Secret unlocked: 'The universe is brighter because of you.' 🌟";
      } else if (currentPlayer === "Sammi") {
        msg = "✨ Sammi, amazing! Secret unlocked: 'Your light shines stronger than the stars.' ✨";
      }
      message.textContent = msg;
      message.style.display = "block";
      playAgainBtn.style.display = "block";
    }

    // Reset game
    function resetGame() {
      score = 0;
      starSpeed = 5;
      spawnRate = 1000;
      gameOver = false;
      scoreDisplay.textContent = "Score: 0";
      message.style.display = "none";
      playAgainBtn.style.display = "none";

      // Remove any leftover stars
      document.querySelectorAll(".star").forEach(star => star.remove());

      stopStarSpawner();
      if (currentPlayer) startStarSpawner();
    }

    // Play again button
    playAgainBtn.addEventListener("click", resetGame);
  </script>
</body>
</html>
